right_arm_pos_joint_traj_controller:
  type: position_controllers/JointTrajectoryController
  joints: &right_arm_joints
    - arm_right_joint1
    - arm_right_joint2
    - arm_right_joint3
    - arm_right_joint4
    - arm_right_joint5
    - arm_right_joint6
    - arm_right_joint7
  constraints:
    goal_time: 0.6
    stopped_velocity_tolerance: 0.05
    arm_right_joint1: {trajectory: 0.1, goal: 0.1}
    arm_right_joint2: {trajectory: 0.1, goal: 0.1}
    arm_right_joint3: {trajectory: 0.1, goal: 0.1}
    arm_right_joint4: {trajectory: 0.1, goal: 0.1}
    arm_right_joint5: {trajectory: 0.1, goal: 0.1}
    arm_right_joint6: {trajectory: 0.1, goal: 0.1}
    arm_right_joint7: {trajectory: 0.1, goal: 0.1}
  stop_trajectory_duration: 0.5
  state_publish_rate: *loop_hz
  action_monitor_rate: 10

left_arm_pos_joint_traj_controller:
  type: position_controllers/JointTrajectoryController
  joints: &left_arm_joints
    - arm_left_joint1
    - arm_left_joint2
    - arm_left_joint3
    - arm_left_joint4
    - arm_left_joint5
    - arm_left_joint6
    - arm_left_joint7
  constraints:
    goal_time: 0.6
    stopped_velocity_tolerance: 0.05
    arm_left_joint1: {trajectory: 0.1, goal: 0.1}
    arm_left_joint2: {trajectory: 0.1, goal: 0.1}
    arm_left_joint3: {trajectory: 0.1, goal: 0.1}
    arm_left_joint4: {trajectory: 0.1, goal: 0.1}
    arm_left_joint5: {trajectory: 0.1, goal: 0.1}
    arm_left_joint6: {trajectory: 0.1, goal: 0.1}
    arm_left_joint7: {trajectory: 0.1, goal: 0.1}
  stop_trajectory_duration: 0.5
  state_publish_rate: *loop_hz
  action_monitor_rate: 10  

head_pos_traj_controller:
  type: position_controllers/JointTrajectoryController
  joints: &head_joints
    - head_joint1
    - head_joint2
    - head_joint3
    - head_joint4
    - head_joint5
    - head_joint6
  constraints:
    goal_time: 0.6
    stopped_velocity_tolerance: 0.05
    head_joint1: {trajectory: 0.1, goal: 0.1}
    head_joint2: {trajectory: 0.1, goal: 0.1}
    head_joint3: {trajectory: 0.1, goal: 0.1}
    head_joint4: {trajectory: 0.1, goal: 0.1}
    head_joint5: {trajectory: 0.1, goal: 0.1}
    head_joint6: {trajectory: 0.1, goal: 0.1}
  stop_trajectory_duration: 0.5
  state_publish_rate: *loop_hz
  action_monitor_rate: 10

