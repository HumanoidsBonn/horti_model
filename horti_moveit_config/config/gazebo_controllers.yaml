head_controller:
  type: position_controllers/JointTrajectoryController
  joints: &head_joints
    - head_joint1
    - head_joint2
    - head_joint3
    - head_joint4
    - head_joint5
    - head_joint6
  constraints:
      # vel_tolerance is 0 for due to the movegroup/follow_joint_trajectory/goal tolerance is empty
      stopped_velocity_tolerance: 0 
      head_joint1: {trajectory: 0.1, goal: 0.1}
      head_joint2: {trajectory: 0.1, goal: 0.36}
      head_joint3: {trajectory: 0.1, goal: 0.1}
      head_joint4: {trajectory: 0.1, goal: 0.1}
      head_joint5: {trajectory: 0.1, goal: 0.1}
      head_joint6: {trajectory: 0.1, goal: 0.1}
