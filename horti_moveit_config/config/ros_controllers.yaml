# Simulation settings for using moveit_sim_controllers
moveit_sim_hw_interface:
  joint_model_group: head
  joint_model_group_pose: obs_pose_1
# Settings for ros_control_boilerplate control loop
generic_hw_control_loop:
  loop_hz: 300
  cycle_time_error_threshold: 0.01
# Settings for ros_control hardware interface
hardware_interface:
  joints: &robot_joints
    - arm_left_joint1
    - arm_left_joint2
    - arm_left_joint3
    - arm_left_joint4
    - arm_left_joint5
    - arm_left_joint6
    - arm_left_joint7
    - arm_right_joint1
    - arm_right_joint2
    - arm_right_joint3
    - arm_right_joint4
    - arm_right_joint5
    - arm_right_joint6
    - arm_right_joint7
    - head_joint1
    - head_joint2
    - head_joint3
    - head_joint4
    - head_joint5
    - head_joint6
  sim_control_mode: 1  # 0: position, 1: velocity
# Publish all joint states
# Creates the /joint_states topic necessary in ROS
joint_state_controller:
  type: joint_state_controller/JointStateController
  publish_rate: 50
controller_list:
- name: "arm_left_controller"
  action_ns: follow_joint_trajectory
  type: FollowJointTrajectory
  joints:
    - arm_left_joint1
    - arm_left_joint2
    - arm_left_joint3
    - arm_left_joint4
    - arm_left_joint5
    - arm_left_joint6
    - arm_left_joint7
- name: "arm_right_controller"
  action_ns: follow_joint_trajectory
  type: FollowJointTrajectory
  joints:
    - arm_right_joint1
    - arm_right_joint2
    - arm_right_joint3
    - arm_right_joint4
    - arm_right_joint5
    - arm_right_joint6
    - arm_right_joint7
    
- name: "head_controller"
  action_ns: follow_joint_trajectory
  type: FollowJointTrajectory
  joints:
    - head_joint1
    - head_joint2
    - head_joint3
    - head_joint4
    - head_joint5
    - head_joint6

- name: "dual_arm_pos_joint_traj_controller"
  action_ns: follow_joint_trajectory
  type: FollowJointTrajectory
  default: True
  joints:
    - arm_left_joint1
    - arm_left_joint2
    - arm_left_joint3
    - arm_left_joint4
    - arm_left_joint5
    - arm_left_joint6
    - arm_left_joint7
    - arm_right_joint1
    - arm_right_joint2
    - arm_right_joint3
    - arm_right_joint4
    - arm_right_joint5
    - arm_right_joint6
    - arm_right_joint7
